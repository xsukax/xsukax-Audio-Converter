<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xsukax Audio Converter - Free Browser Audio Converter</title>
    <meta name="description" content="Convert audio files between formats directly in your browser. All processing happens locally - no uploads required!">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 2rem; margin-bottom: 10px; font-weight: 700; }
        .header p { opacity: 0.95; font-size: 0.95rem; }
        .content { padding: 30px; }
        .section { margin-bottom: 30px; }
        .section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; color: #667eea; display: flex; align-items: center; gap: 8px; }
        .input-group { margin-bottom: 20px; }
        .input-label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; color: #555; }
        .file-input-wrapper { position: relative; display: inline-block; width: 100%; }
        .file-input-wrapper input[type="file"] { position: absolute; left: -9999px; }
        .file-input-label { display: block; padding: 50px 20px; border: 3px dashed #667eea; border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.3s ease; background: #f8f9ff; }
        .file-input-label:hover { border-color: #764ba2; background: #f0f1ff; transform: translateY(-2px); }
        .file-input-label.dragover { border-color: #764ba2; background: #e8e9ff; transform: scale(1.02); }
        .file-input-icon { font-size: 3rem; margin-bottom: 10px; }
        .file-input-text { font-size: 1rem; color: #667eea; font-weight: 500; }
        .file-input-subtext { font-size: 0.85rem; color: #888; margin-top: 5px; }
        .selected-file { background: #e8f5e9; padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
        .selected-file.show { display: block; }
        .selected-file-name { font-weight: 600; color: #2e7d32; font-size: 0.95rem; }
        .selected-file-size { color: #666; font-size: 0.85rem; margin-top: 5px; }
        select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.95rem; background: white; cursor: pointer; transition: all 0.3s ease; }
        select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .button-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .button-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        .button-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .output-console { background: #1e1e1e; color: #d4d4d4; padding: 20px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 0.85rem; max-height: 300px; overflow-y: auto; line-height: 1.6; }
        .output-console::-webkit-scrollbar { width: 8px; }
        .output-console::-webkit-scrollbar-track { background: #2d2d2d; border-radius: 4px; }
        .output-console::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .output-console::-webkit-scrollbar-thumb:hover { background: #666; }
        .log-entry { margin-bottom: 8px; }
        .log-info { color: #4ec9b0; }
        .log-success { color: #4ec9b0; font-weight: 600; }
        .log-error { color: #f48771; font-weight: 600; }
        .log-warning { color: #dcdcaa; }
        .progress-container { margin-top: 20px; display: none; }
        .progress-container.show { display: block; }
        .progress-label { margin-bottom: 8px; font-size: 0.9rem; color: #666; display: flex; justify-content: space-between; }
        .progress-bar-wrapper { width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); border-radius: 4px; transition: width 0.3s ease; width: 0%; }
        .notification-container { position: fixed; top: 20px; right: 20px; z-index: 1000; max-width: 350px; }
        .notification { background: white; padding: 16px 20px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px; animation: slideIn 0.3s ease; border-left: 4px solid #667eea; }
        .notification.success { border-left-color: #4caf50; }
        .notification.error { border-left-color: #f44336; }
        .notification.warning { border-left-color: #ff9800; }
        .notification-icon { font-size: 1.5rem; flex-shrink: 0; }
        .notification-content { flex: 1; }
        .notification-title { font-weight: 600; margin-bottom: 4px; font-size: 0.95rem; }
        .notification-message { font-size: 0.85rem; color: #666; }
        .notification-close { cursor: pointer; font-size: 1.2rem; color: #999; flex-shrink: 0; }
        .notification-close:hover { color: #333; }
        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(400px); opacity: 0; } }
        .notification.hiding { animation: slideOut 0.3s ease; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #667eea; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer { text-align: center; padding: 20px; color: #888; font-size: 0.85rem; border-top: 1px solid #e0e0e0; }
        .footer a { color: #667eea; text-decoration: none; font-weight: 500; }
        .footer a:hover { text-decoration: underline; }
        @media (max-width: 768px) { body { padding: 10px; } .header h1 { font-size: 1.5rem; } .content { padding: 20px; } .notification-container { max-width: calc(100% - 20px); right: 10px; left: 10px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 xsukax Audio Converter</h1>
            <p>Convert audio files between formats directly in your browser - 100% private, no uploads!</p>
        </div>
        
        <div class="content">
            <div class="section">
                <div class="section-title">📁 Select Audio File</div>
                <div class="input-group">
                    <div class="file-input-wrapper">
                        <input type="file" id="audioFile" accept="audio/*">
                        <label for="audioFile" id="fileLabel" class="file-input-label">
                            <div class="file-input-icon">🎵</div>
                            <div class="file-input-text">Click to select or drag & drop audio file</div>
                            <div class="file-input-subtext">Supports all audio formats (MP3, WAV, FLAC, AAC, OGG, etc.)</div>
                        </label>
                    </div>
                    <div id="selectedFile" class="selected-file">
                        <div class="selected-file-name" id="fileName"></div>
                        <div class="selected-file-size" id="fileSize"></div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">⚙️ Conversion Settings</div>
                <div class="input-group">
                    <label class="input-label" for="outputFormat">Output Format</label>
                    <select id="outputFormat">
                        <option value="mp3">MP3 (MPEG Audio Layer 3)</option>
                        <option value="wav">WAV (Waveform Audio)</option>
                        <option value="flac">FLAC (Free Lossless Audio)</option>
                        <option value="aac">AAC (Advanced Audio Coding)</option>
                        <option value="ogg">OGG (Ogg Vorbis)</option>
                        <option value="m4a">M4A (MPEG-4 Audio)</option>
                    </select>
                </div>
                <div class="input-group" id="bitrateGroup" style="display: none;">
                    <label class="input-label" for="bitrate">Audio Bitrate</label>
                    <select id="bitrate">
                        <option value="">Default (Auto)</option>
                    </select>
                </div>
            </div>

            <div class="section">
                <button id="convertBtn" class="button button-primary" disabled>
                    <span>🔄 Convert Audio</span>
                </button>
                <div id="progressContainer" class="progress-container">
                    <div class="progress-label">
                        <span id="progressLabel">Loading FFmpeg...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar-wrapper">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📊 Console Output</div>
                <div class="output-console" id="console">
                    <div class="log-entry log-info">Initializing xsukax Audio Converter...</div>
                </div>
            </div>
        </div>

        <div class="footer">
            Created by <a href="https://github.com/xsukax" target="_blank">xsukax</a> | 
            <a href="https://github.com/xsukax/xsukax-Audio-Converter" target="_blank">View on GitHub</a>
        </div>
    </div>

    <div class="notification-container" id="notificationContainer"></div>

    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({
            log: true,
            corePath: 'https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js',
            mainName: 'main',
            progress: ({ ratio }) => {
                if (ratio >= 0 && ratio <= 1) {
                    updateProgress(Math.round(ratio * 100), 'Converting...');
                }
            }
        });

        let isFFmpegLoaded = false;
        let selectedFile = null;
        let isConverting = false;

        // Initialize DOM elements
        const elements = {
            fileInput: document.getElementById('audioFile'),
            fileLabel: document.getElementById('fileLabel'),
            selectedFileDiv: document.getElementById('selectedFile'),
            fileName: document.getElementById('fileName'),
            fileSize: document.getElementById('fileSize'),
            outputFormat: document.getElementById('outputFormat'),
            bitrateGroup: document.getElementById('bitrateGroup'),
            bitrate: document.getElementById('bitrate'),
            convertBtn: document.getElementById('convertBtn'),
            progressContainer: document.getElementById('progressContainer'),
            progressLabel: document.getElementById('progressLabel'),
            progressPercent: document.getElementById('progressPercent'),
            progressBar: document.getElementById('progressBar'),
            console: document.getElementById('console'),
            notificationContainer: document.getElementById('notificationContainer')
        };

        // Utility functions
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            elements.console.appendChild(entry);
            elements.console.scrollTop = elements.console.scrollHeight;
        }

        function updateProgress(percentage, label) {
            elements.progressBar.style.width = `${percentage}%`;
            elements.progressPercent.textContent = `${percentage}%`;
            if (label) elements.progressLabel.textContent = label;
        }

        function showNotification(title, message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };

            notification.innerHTML = `
                <div class="notification-icon">${icons[type]}</div>
                <div class="notification-content">
                    <div class="notification-title">${title}</div>
                    <div class="notification-message">${message}</div>
                </div>
                <div class="notification-close">×</div>
            `;

            elements.notificationContainer.appendChild(notification);

            const closeBtn = notification.querySelector('.notification-close');
            closeBtn.addEventListener('click', () => removeNotification(notification));

            setTimeout(() => removeNotification(notification), 5000);
        }

        function removeNotification(notification) {
            notification.classList.add('hiding');
            setTimeout(() => {
                if (notification.parentElement) {
                    notification.parentElement.removeChild(notification);
                }
            }, 300);
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        function isAudioFile(filename) {
            const audioExtensions = ['.mp3', '.wav', '.flac', '.aac', '.ogg', '.m4a', '.opus', '.wma', '.ape', '.alac', '.wv', '.tta'];
            return audioExtensions.some(ext => filename.toLowerCase().endsWith(ext));
        }

        function getBitrateOptions(format) {
            const bitrateMap = {
                'mp3': ['320k', '256k', '192k', '128k', '96k', '64k'],
                'aac': ['320k', '256k', '192k', '128k', '96k', '64k'],
                'ogg': ['320k', '256k', '192k', '128k', '96k', '64k'],
                'm4a': ['320k', '256k', '192k', '128k', '96k', '64k'],
                'wav': [],
                'flac': []
            };
            return bitrateMap[format] || [];
        }

        function updateBitrateOptions() {
            const format = elements.outputFormat.value;
            const bitrateOptions = getBitrateOptions(format);

            if (bitrateOptions.length > 0) {
                elements.bitrateGroup.style.display = 'block';
                elements.bitrate.innerHTML = '<option value="">Default (Auto)</option>';
                bitrateOptions.forEach(bitrate => {
                    const option = document.createElement('option');
                    option.value = bitrate;
                    option.textContent = bitrate;
                    elements.bitrate.appendChild(option);
                });
            } else {
                elements.bitrateGroup.style.display = 'none';
            }
        }

        function getOutputFileName(inputFileName, format) {
            const nameWithoutExt = inputFileName.substring(0, inputFileName.lastIndexOf('.')) || inputFileName;
            return `${nameWithoutExt}.${format}`;
        }

        function getMimeType(format) {
            const mimeTypes = {
                'mp3': 'audio/mpeg',
                'wav': 'audio/wav',
                'flac': 'audio/flac',
                'aac': 'audio/aac',
                'ogg': 'audio/ogg',
                'm4a': 'audio/mp4'
            };
            return mimeTypes[format] || 'audio/mpeg';
        }

        function downloadFile(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            log(`Downloaded: ${fileName}`, 'success');
        }

        // FFmpeg initialization
        async function loadFFmpeg() {
            try {
                log('Loading FFmpeg...', 'info');
                elements.progressContainer.classList.add('show');
                updateProgress(0, 'Initializing FFmpeg...');
                
                await ffmpeg.load();

                isFFmpegLoaded = true;
                updateProgress(100, 'FFmpeg loaded successfully!');
                log('FFmpeg loaded successfully!', 'success');
                showNotification('Ready to Convert', 'FFmpeg loaded successfully. Select an audio file to begin.', 'success');
                
                setTimeout(() => {
                    elements.progressContainer.classList.remove('show');
                }, 2000);
                
            } catch (error) {
                log(`Error loading FFmpeg: ${error.message}`, 'error');
                showNotification('Initialization Error', 'Failed to load FFmpeg. Please refresh the page.', 'error');
                elements.progressContainer.classList.remove('show');
            }
        }

        // File handling
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('audio/') && !isAudioFile(file.name)) {
                showNotification('Invalid File', 'Please select a valid audio file.', 'error');
                return;
            }

            selectedFile = file;
            elements.fileName.textContent = `📄 ${file.name}`;
            elements.fileSize.textContent = `Size: ${formatFileSize(file.size)}`;
            elements.selectedFileDiv.classList.add('show');
            elements.convertBtn.disabled = !isFFmpegLoaded;
            
            log(`File selected: ${file.name} (${formatFileSize(file.size)})`, 'info');
            updateBitrateOptions();
        }

        // Audio conversion
        async function convertAudio() {
            if (!selectedFile || isConverting || !isFFmpegLoaded) return;

            isConverting = true;
            elements.convertBtn.disabled = true;
            elements.progressContainer.classList.add('show');
            
            try {
                const inputFileName = selectedFile.name;
                const outputFormat = elements.outputFormat.value;
                const outputFileName = getOutputFileName(inputFileName, outputFormat);
                const bitrate = elements.bitrate.value;

                log(`Starting conversion to ${outputFormat.toUpperCase()}...`, 'info');
                updateProgress(0, 'Loading file...');

                // Write input file
                ffmpeg.FS('writeFile', inputFileName, await fetchFile(selectedFile));
                log('File loaded into FFmpeg memory', 'info');
                updateProgress(10, 'File loaded, starting conversion...');

                // Build FFmpeg command
                const args = ['-i', inputFileName];
                
                if (bitrate) {
                    args.push('-b:a', bitrate);
                    log(`Using bitrate: ${bitrate}`, 'info');
                }

                args.push(outputFileName);
                
                log(`Executing: ffmpeg ${args.join(' ')}`, 'info');

                // Execute conversion
                await ffmpeg.run(...args);

                updateProgress(90, 'Reading output file...');
                
                // Read output file
                const data = ffmpeg.FS('readFile', outputFileName);
                
                updateProgress(100, 'Conversion complete!');
                log('Conversion completed successfully!', 'success');

                // Download file
                const blob = new Blob([data.buffer], { type: getMimeType(outputFormat) });
                downloadFile(blob, outputFileName);

                // Cleanup
                ffmpeg.FS('unlink', inputFileName);
                ffmpeg.FS('unlink', outputFileName);

                showNotification('Conversion Complete!', `${outputFileName} has been downloaded successfully.`, 'success');
                
            } catch (error) {
                log(`Conversion error: ${error.message}`, 'error');
                showNotification('Conversion Failed', error.message, 'error');
            } finally {
                isConverting = false;
                elements.convertBtn.disabled = false;
                setTimeout(() => {
                    elements.progressContainer.classList.remove('show');
                    updateProgress(0, '');
                }, 3000);
            }
        }

        // Event listeners
        elements.fileInput.addEventListener('change', handleFileSelect);
        elements.outputFormat.addEventListener('change', updateBitrateOptions);
        elements.convertBtn.addEventListener('click', convertAudio);

        // Drag and drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            elements.fileLabel.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            elements.fileLabel.addEventListener(eventName, () => {
                elements.fileLabel.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            elements.fileLabel.addEventListener(eventName, () => {
                elements.fileLabel.classList.remove('dragover');
            });
        });

        elements.fileLabel.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                elements.fileInput.files = files;
                handleFileSelect({ target: { files } });
            }
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadFFmpeg();
        });
    </script>
</body>
</html>
